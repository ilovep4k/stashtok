name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JavaScript syntax
        run: node --check plugins/stashTok/stashTok.js

      - name: Manifest parses and has no unsupported keys
        run: |
          python - <<'PY'
          import sys, yaml
          manifest = yaml.safe_load(open("plugins/stashTok/stashTok.yml"))
          allowed = {"displayName", "description", "type"}
          for name, setting in (manifest.get("settings") or {}).items():
              extra = set(setting) - allowed
              if extra:
                  sys.exit(f"{name}: unsupported setting keys {sorted(extra)}")
              if setting.get("type") not in {"BOOLEAN", "STRING", "NUMBER"}:
                  sys.exit(f"{name}: bad type {setting.get('type')}")
          print("manifest ok")
          PY

      - name: Build the package
        run: python tools/build.py