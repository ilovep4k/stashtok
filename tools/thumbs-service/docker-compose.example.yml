# Resized-thumbnail sidecar, one service per Stash instance.
# Stash has no on-the-fly resize for scene screenshots or performer images, so the
# app asks this service for a 320 px JPEG instead of downloading 100-160 KB originals
# into 200 px boxes. Each request is rendered once and cached on disk.
#
# STASH_KEY: that instance's API key. Do not commit it - pass it in by env file or
# the Portainer stack environment instead of hardcoding it here.
services:
  thumbs-main:
    build: .
    # image: stashtok-thumbs:local
    container_name: stashtok-thumbs-main
    restart: unless-stopped
    ports:
      - "18997:8080"          # serves instance on :9997
    environment:
      STASH_URL: http://172.17.0.1:9997
      STASH_KEY: "${STASH_KEY:?set STASH_KEY}"
      CACHE_DIR: /cache
    volumes:
      - ./cache/main:/cache

  thumbs-second:
    build: .
    container_name: stashtok-thumbs-second
    restart: unless-stopped
    ports:
      - "18996:8080"          # serves instance on :9998
    environment:
      STASH_URL: http://172.17.0.1:9998
      STASH_KEY: "${STASH_KEY_SECOND:?set STASH_KEY_SECOND}"
      CACHE_DIR: /cache
    volumes:
      - ./cache/second:/cache
